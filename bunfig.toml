# pnpm-style symlinked node_modules — no phantom dependencies
[install]
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# the shared lint config and the skill-gate hook ship from the same owner as noslop, which tracks
# their releases closely; each pinned version's provenance is checked before the pin
minimumReleaseAgeExcludes = [
  "@zgeoff/oxlint-config",
  "@zgeoff/skill-gate",
  # tsrs 0.18.0 and its native packages skip the gate so typecheck can move to
  # it now; these entries come out on 2026-10-26, once tsrs 0.18.0 is 7 days old
  "tsrs",
  "@tsrs/darwin-arm64",
  "@tsrs/linux-arm64-gnu",
  "@tsrs/linux-arm64-musl",
  "@tsrs/linux-x64-gnu",
  "@tsrs/linux-x64-musl",
]

[test]
# registers the jest-extended matchers, and starts the stand-in GitHub API with its resets
preload = ["@zgeoff/bun-test-extended", "./libs/testing/src/start-github-stand-in.ts"]

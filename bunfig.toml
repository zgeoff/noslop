# pnpm-style symlinked node_modules — no phantom dependencies
[install]
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# first-party packages skip the gate; their third-party dependencies stay behind it
minimumReleaseAgeExcludes = [
  "@zgeoff/agent-hooks",
  "@zgeoff/bun-test-extended",
  "@zgeoff/chex",
  "@zgeoff/diet",
  "@zgeoff/format-codemod",
  "@zgeoff/oxlint-config",
  "@zgeoff/rig",
  "@zgeoff/std",
  "@zgeoff/testing",
]

[test]
# registers the jest-extended matchers and the kit's hooks, and starts the stand-in GitHub API on the
# test network
preload = [
  "@zgeoff/bun-test-extended",
  "@zgeoff/testing/preload",
  "./adapters/github/src/test-utils/github-network.ts",
]

# Git hooks. pre-commit fixes staged files only (fast); pre-push runs the
# chex baseline, which lefthook extends from node_modules, plus the cheap
# whole-tree gates below. CI runs every whole-tree check: type-aware lint,
# dead code, and the full test suite.

extends:
  - node_modules/@zgeoff/chex/lefthook.yml

pre-commit:
  piped: true
  jobs:
    - name: chex-baseline
      files: echo package.json
      run: |
        if [ ! -f node_modules/@zgeoff/chex/lefthook.yml ]; then
          echo "chex-baseline: node_modules/@zgeoff/chex/lefthook.yml is missing, so lefthook runs none of the chex baseline's jobs; run bun install, then try again"
          exit 1
        fi
        # {files}
    - name: oxlint --fix
      glob: '*.{js,mjs,cjs,ts,mts,cts}'
      run: node_modules/.bin/oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: '*.{js,mjs,cjs,ts,mts,cts,json,jsonc,md,yml,yaml}'
      run: node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    # the exclude mirrors .formatignore: the tool exits 2 when every file
    # it is given is ignored, so ignored files must not reach it
    - name: format-codemod
      glob: '*.{ts,tsx}'
      exclude:
        - '.claude/hooks/skill-gate/**'
        - '**/dist/**'
        - '**/coverage/**'
        - '.worktrees/**'
      run: node_modules/.bin/format-codemod --quiet {staged_files}
      stage_fixed: true
    # last so it scans what the fixers above re-staged; needs the gitleaks
    # binary on PATH (mise: `mise use -g gitleaks`)
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --redact --no-banner

commit-msg:
  jobs:
    - name: commitlint
      run: node_modules/.bin/commitlint --edit {1}

# runs before the baseline's jobs; the baseline sets piped
pre-push:
  jobs:
    - name: chex-baseline
      files: echo package.json
      run: |
        if [ ! -f node_modules/@zgeoff/chex/lefthook.yml ]; then
          echo "chex-baseline: node_modules/@zgeoff/chex/lefthook.yml is missing, so lefthook runs none of the chex baseline's jobs; run bun install, then try again"
          exit 1
        fi
        # {files}
    - name: boundaries
      run: bun run boundaries
    - name: prose
      run: bun run prose
    - name: package-types
      run: bun run check:package-types
    # the baseline's test job runs rig related, which skips test:related, so
    # the sweep of finished test runs' temp folders runs here
    - name: temp-sweep
      run: bun scripts/run-temp-sweep.ts

# Runs the shared Bun checks on every push to main, with the script list that
# the BUN_CHECK_SCRIPTS repo variable sets for pull requests, then releases
# @noslop/cli through the shared release-please job and publishes it to npm.
name: main

on:
  push:
    branches: [main]
  # Publishes the CLI at the dispatched ref once its checks pass: the run that
  # dispatch-release starts at a tag, and the recovery path for a release that
  # tagged but failed to publish. It skips the release job, and a version npm
  # holds already is skipped.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    # A newer push makes an older run's checks moot. A publish run dispatched
    # at a release tag has a ref of its own, so a push never cancels it.
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: true
    # GitHub checks the called workflow's job permissions even for its skipped
    # gitleaks job, which asks for pull-requests: write
    permissions:
      contents: read
      pull-requests: write
    uses: zgeoff/tools/.github/workflows/bun-checks.yml@sync-v32
    with:
      scripts: ${{ vars.BUN_CHECK_SCRIPTS }}
      # the pull request that landed the commits already scanned them
      gitleaks: false

  # A release takes two runs of the release job, through the shared
  # release-please job in zgeoff/tools (docs/runbooks/releasing.md):
  # - after a releasable commit lands on main, release-please opens or updates
  #   the release PR, and the shared job's sync command repairs its lockfile
  #   and formatting. A maintainer merges the PR by hand, so merge stays off.
  # - the run of that merge's push tags the release, and publish-release ships
  #   the CLI to npm through OIDC once the run's checks pass.
  #
  # The release job waits for no checks: the release PR passed its own, and
  # the tag must land while the merge commit is still main's head, as the
  # release App's token cannot tag a commit behind a workflow change. The
  # release waits for its one-time setup, which the RELEASE_ENABLED repo
  # variable marks done.
  release:
    if: github.event_name == 'push' && vars.RELEASE_ENABLED == 'true'
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
    uses: zgeoff/tools/.github/workflows/release-please.yml@sync-v32
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
      merge: false
      # release-please names the branch after the root package's component
      release-branch: release-please--branches--main--components--@noslop/cli
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # Picks whether this run publishes, dispatches a run at its tag, or ships
  # nothing. It runs after a failed or skipped need too, since a tag whose
  # checks a newer push cancelled still needs its dispatch.
  pick-release-ship:
    needs: [checks, release]
    if: ${{ !cancelled() && vars.RELEASE_ENABLED == 'true' }}
    concurrency:
      group: pick-release-ship
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ship: ${{ steps.pick.outputs.ship }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Pick the release ship
        id: pick
        env:
          RELEASES_CREATED: ${{ needs.release.outputs.releases_created }}
          RELEASE_OUTPUTS: ${{ needs.release.outputs.release-outputs }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: bun run --silent ci:pick-release-ship

  # A cancelled run could stop a publish halfway, so publish runs queue
  # instead; queue: max keeps a waiting publish from being replaced.
  publish-release:
    needs: [pick-release-ship]
    if: ${{ !cancelled() && needs.pick-release-ship.outputs.ship == 'here' }}
    concurrency:
      group: publish-release
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # npm's trusted publishing takes the job's OIDC token, so no npm token
      # exists anywhere in this repository
      id-token: write
    steps:
      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Trusted publishing needs npm 11.5.1 or later, which node 24 bundles.
      - name: Set up node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the CLI package
        run: bun run build:cli
      - name: Publish the CLI
        run: bun run --silent ci:publish-cli

  # npm provenance records the run's commit, so the run at the tag checks and
  # publishes it. A dispatch is the one GITHUB_TOKEN event that starts a
  # workflow.
  dispatch-release:
    needs: [release, pick-release-ship]
    if: ${{ !cancelled() && needs.pick-release-ship.outputs.ship == 'dispatch' }}
    concurrency:
      group: dispatch-release
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the publish run at the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh workflow run main.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
